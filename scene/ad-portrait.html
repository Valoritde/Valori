<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  :root{
    --bg0:#0a0f1e; --bg1:#05070f;
    --accent:#2f7bff; --accent2:#27d3c4;
    --ink:#ffffff; --muted:#9fb0cc;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;background:var(--bg1);}
  #stage{
    position:relative;width:1080px;height:1350px;
    font-family:"Liberation Sans","Helvetica Neue",Arial,sans-serif;color:var(--ink);
    background:
      radial-gradient(900px 900px at 20% 12%, rgba(47,123,255,.20), transparent 60%),
      radial-gradient(820px 820px at 92% 96%, rgba(39,211,196,.14), transparent 62%),
      linear-gradient(160deg,var(--bg0),var(--bg1));
    overflow:hidden;
  }
  #grid{position:absolute;inset:-10%;
    background-image:
      linear-gradient(rgba(120,150,200,.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(120,150,200,.06) 1px,transparent 1px);
    background-size:78px 78px;
    -webkit-mask-image:radial-gradient(900px 1100px at 50% 38%,#000 35%,transparent 80%);
    mask-image:radial-gradient(900px 1100px at 50% 38%,#000 35%,transparent 80%);}
  .orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;mix-blend-mode:screen;}
  #orbA{width:560px;height:560px;left:-140px;top:-80px;background:radial-gradient(circle,var(--accent),transparent 70%);}
  #orbB{width:540px;height:540px;right:-150px;bottom:-160px;background:radial-gradient(circle,var(--accent2),transparent 70%);}
  #vignette{position:absolute;inset:0;box-shadow:inset 0 0 360px 90px rgba(0,0,0,.6);pointer-events:none;}

  #wrap{position:absolute;inset:0;display:flex;flex-direction:column;padding:74px 78px;}

  .top{display:flex;align-items:center;justify-content:space-between;}
  .brand{font-size:46px;font-weight:800;letter-spacing:-1px;}
  .brand .dot{color:var(--accent);}
  .kicker{font-size:23px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);font-weight:700;}

  .headline{margin-top:54px;font-size:84px;font-weight:800;line-height:1.05;letter-spacing:-2px;}
  .headline .q{color:var(--accent);}
  .sub{margin-top:26px;font-size:38px;font-weight:600;color:#dbe6fb;line-height:1.3;}
  .sub b{color:var(--accent2);font-weight:800;}

  /* browser mockup */
  .mock{margin:46px auto 0;width:760px;border-radius:22px;overflow:hidden;
    box-shadow:0 40px 90px rgba(0,0,0,.55), 0 0 0 1px rgba(140,170,230,.18);
    transform:perspective(1600px) rotateX(6deg);}
  .mbar{height:54px;background:#0e1424;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:1px solid rgba(140,170,230,.15);}
  .mbar .d{width:15px;height:15px;border-radius:50%;}
  .d1{background:#ff5f57;}.d2{background:#febc2e;}.d3{background:#28c840;}
  .murl{margin-left:18px;flex:1;height:30px;border-radius:8px;background:#1a2236;display:flex;align-items:center;padding:0 16px;font-size:19px;color:#8aa0c8;}
  .mbody{background:linear-gradient(160deg,#0c1426,#0a1120);padding:34px 34px 40px;}
  .mhero{display:flex;gap:26px;align-items:center;}
  .mhero .left{flex:1;}
  .chip{display:inline-block;font-size:16px;font-weight:700;letter-spacing:.12em;color:var(--accent2);background:rgba(39,211,196,.12);border:1px solid rgba(39,211,196,.3);padding:6px 14px;border-radius:20px;}
  .mh1{height:26px;width:88%;border-radius:7px;margin-top:18px;background:linear-gradient(90deg,#eaf0ff,#9fb6e6);}
  .mh1.s{width:62%;margin-top:12px;}
  .mline{height:12px;border-radius:6px;background:rgba(160,180,220,.28);margin-top:16px;}
  .mline.w1{width:90%;}.mline.w2{width:78%;}
  .mbtn{margin-top:22px;display:inline-block;height:42px;width:170px;border-radius:24px;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 10px 24px rgba(47,123,255,.45);}
  .mart{width:210px;height:200px;border-radius:16px;background:
      radial-gradient(120px 120px at 70% 30%,rgba(47,123,255,.55),transparent 60%),
      linear-gradient(150deg,#13203b,#0c1730);border:1px solid rgba(140,170,230,.18);
      display:flex;align-items:center;justify-content:center;font-size:64px;}
  .mcards{display:flex;gap:18px;margin-top:30px;}
  .mcard{flex:1;height:96px;border-radius:14px;background:rgba(20,30,52,.85);border:1px solid rgba(140,170,230,.14);padding:16px;}
  .mcard .ic{width:34px;height:34px;border-radius:9px;background:linear-gradient(150deg,rgba(47,123,255,.4),rgba(39,211,196,.25));}
  .mcard .l{height:9px;border-radius:5px;background:rgba(160,180,220,.3);margin-top:14px;width:80%;}
  .mcard .l2{width:55%;margin-top:8px;}

  .benefits{margin-top:auto;display:flex;gap:18px;}
  .ben{flex:1;display:flex;align-items:center;gap:14px;font-size:26px;font-weight:700;color:#e6eefc;}
  .ben .bi{width:54px;height:54px;flex:0 0 54px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;
    background:linear-gradient(150deg,rgba(47,123,255,.28),rgba(39,211,196,.16));border:1.5px solid rgba(120,170,255,.4);}

  .ctaRow{margin-top:42px;display:flex;align-items:center;justify-content:space-between;}
  .cta{font-size:34px;font-weight:800;color:#04122e;padding:26px 44px;border-radius:50px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 18px 50px rgba(47,123,255,.5);}
  .url{font-size:34px;font-weight:800;letter-spacing:-.5px;}
  .url .dot{color:var(--accent);}
  .url small{display:block;font-size:21px;font-weight:600;color:var(--muted);letter-spacing:.05em;margin-top:4px;}
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <div id="orbA" class="orb"></div>
  <div id="orbB" class="orb"></div>

  <div id="wrap">
    <div class="top">
      <div class="brand">Valor<span class="dot">IT.</span></div>
      <div class="kicker">WEBDESIGN &amp; ENTWICKLUNG</div>
    </div>

    <div class="headline">Du brauchst eine Website &ndash;<br>und weißt nicht <span class="q">wie?</span></div>
    <div class="sub">Kein Problem. Wir bauen sie für dich &mdash; <b>schnell, modern &amp; professionell.</b></div>

    <div class="mock">
      <div class="mbar"><span class="d d1"></span><span class="d d2"></span><span class="d d3"></span>
        <div class="murl">https://deine-firma.de</div>
      </div>
      <div class="mbody">
        <div class="mhero">
          <div class="left">
            <span class="chip">DEINE MARKE</span>
            <div class="mh1"></div><div class="mh1 s"></div>
            <div class="mline w1"></div><div class="mline w2"></div>
            <div class="mbtn"></div>
          </div>
          <div class="mart">🚀</div>
        </div>
        <div class="mcards">
          <div class="mcard"><div class="ic"></div><div class="l"></div><div class="l l2"></div></div>
          <div class="mcard"><div class="ic"></div><div class="l"></div><div class="l l2"></div></div>
          <div class="mcard"><div class="ic"></div><div class="l"></div><div class="l l2"></div></div>
        </div>
      </div>
    </div>

    <div class="benefits">
      <div class="ben"><div class="bi">⚡</div>Schnell online</div>
      <div class="ben"><div class="bi">✨</div>Modernes Design</div>
      <div class="ben"><div class="bi">📱</div>Für jedes Gerät</div>
    </div>

    <div class="ctaRow">
      <div class="cta">Jetzt anfragen →</div>
      <div class="url">valorit<span class="dot">.de</span><small>@valorit</small></div>
    </div>
  </div>

  <div id="vignette"></div>
</div>
</body>
</html>
